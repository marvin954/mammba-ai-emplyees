version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: nexusos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexusos
      POSTGRES_PASSWORD: nexusos_dev_password
      POSTGRES_DB: nexusos
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nexusos-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
